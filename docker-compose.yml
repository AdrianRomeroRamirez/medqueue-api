services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: medqueue_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - medqueue

  nginx:
    image: nginx:alpine
    container_name: medqueue_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - medqueue

  db:
    image: mysql:8.0
    container_name: medqueue_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: medqueue
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: medqueue
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - medqueue

networks:
  medqueue:
    driver: bridge

volumes:
  dbdata: